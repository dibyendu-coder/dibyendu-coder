
name: Update GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophies
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: 'username=dibyendu-coder&theme=onedark&column=6&no-frame=true'
          path: profile/trophy.svg
          token: ${{ github.token }}

      - name: Commit trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub trophies"
          git push
